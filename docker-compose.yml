name: wacrm

services:
  app:
    image: wacrm-app:local
    build: &app-build
      context: .
      # NEXT_PUBLIC_* vars are inlined at build time — forward them
      # from .env.local as build args. Changing any of them requires
      # a rebuild (docker compose up --build).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
    # Runtime (server-only) secrets come from .env.local; they are
    # never baked into the image.
    env_file:
      - .env.local
    # The server always listens on 3000 inside the container. Pinned
    # here because `environment` wins over `env_file`, so a stray PORT
    # in .env.local can't desync the app from the mapping and the
    # healthcheck below.
    environment:
      PORT: 3000
      # The embedded WhatsApp gateway (QR-code mode). wacrm owns it: the
      # URL is the compose service, the admin key is generated once by
      # `openwa-key` into a volume both containers mount. Nothing to type.
      OPENWA_URL: http://openwa:2785
      OPENWA_API_KEY_FILE: /run/wacrm-gateway/gateway.key
      OPENWA_WEBHOOK_BASE_URL: http://app:3000
      # The gateway's per-client rate limits below; the history import
      # paces itself under them.
      OPENWA_RATE_LIMIT_PER_MIN: 600
      OPENWA_RATE_LIMIT_PER_HOUR: 36000
      # Cron endpoints' secret when .env.local sets no
      # AUTOMATION_CRON_SECRET (generated once by `openwa-key`).
      AUTOMATION_CRON_SECRET_FILE: /run/wacrm-gateway/cron.secret
    volumes:
      - gateway-key:/run/wacrm-gateway:ro
    depends_on:
      openwa-key:
        condition: service_completed_successfully
      openwa:
        condition: service_started
    # Host side only — HOST_PORT=8080 publishes the app on :8080.
    ports:
      - '${HOST_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------
  # The scheduler: every 60 s it calls the cron endpoints (automations
  # — which also continues broadcasts, the inbound fan-out and the QR
  # history import —, the broadcast cron, and the flow sweep every
  # 5 min) with the cron secret. Same image as `app`; no crontab.
  # ----------------------------------------------------------------
  scheduler:
    image: wacrm-app:local
    build: *app-build
    restart: unless-stopped
    command: ['node', 'scripts/wacrm.mjs', 'cron']
    env_file:
      - .env.local
    environment:
      WACRM_CRON_URL: http://app:3000
      AUTOMATION_CRON_SECRET_FILE: /run/wacrm-gateway/cron.secret
    volumes:
      - gateway-key:/run/wacrm-gateway:ro
    depends_on:
      openwa-key:
        condition: service_completed_successfully
      app:
        condition: service_started

  # ----------------------------------------------------------------
  # The WhatsApp gateway for the "QR Code" connection mode, built from
  # the OpenWA source vendored in packages/openwa (git subtree). It is
  # part of wacrm: no profile, nothing to configure. Its admin API is
  # not published — only `app` talks to it, over the compose network.
  # Engine: whatsapp-web.js (default, lower ban risk) or baileys via
  # OPENWA_ENGINE_TYPE; changing it requires re-scanning the QR code.
  # ----------------------------------------------------------------
  openwa:
    build:
      context: ./packages/openwa
    image: wacrm-openwa:local
    restart: unless-stopped
    stop_grace_period: 75s
    depends_on:
      openwa-key:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 2785
      ENGINE_TYPE: ${OPENWA_ENGINE_TYPE:-whatsapp-web.js}
      # Webhooks go to the wacrm container on the private network.
      SSRF_ALLOWED_HOSTS: app
      # wacrm is the UI; OpenWA's own dashboard is not served.
      SERVE_DASHBOARD: 'false'
      # Per-client rate limits: wacrm is the only client (stock 10/s,
      # 100/min and 1000/h would throttle a history import). Keep the
      # per-minute/per-hour values in sync with app's OPENWA_RATE_LIMIT_*.
      RATE_LIMIT_SHORT_LIMIT: 20
      RATE_LIMIT_MEDIUM_LIMIT: 600
      RATE_LIMIT_LONG_LIMIT: 36000
    # The provisioned key seeds OpenWA's admin key on its first boot
    # (API_MASTER_KEY; an existing data volume keeps the key it has —
    # openwa-key adopts it).
    command: ['sh', '-c', 'API_MASTER_KEY="$$(cat /run/wacrm-gateway/gateway.key)" exec node dist/main']
    volumes:
      - openwa-data:/app/data
      - gateway-key:/run/wacrm-gateway:ro

  # One-shot: generate the gateway admin key on the first `up` (or adopt
  # the key an existing OpenWA data volume already holds) and the cron
  # secret, then exit.
  openwa-key:
    build:
      context: ./packages/openwa
    image: wacrm-openwa:local
    restart: 'no'
    user: root
    entrypoint: ['node', '-e']
    command:
      - |
        const fs = require('fs'), crypto = require('crypto');
        const file = '/run/wacrm-gateway/gateway.key';
        const have = fs.existsSync(file) && fs.readFileSync(file, 'utf8').trim();
        if (!have) {
          let key = '';
          try { key = fs.readFileSync('/app/data/.api-key', 'utf8').trim(); } catch {}
          const source = key ? 'adopted' : 'generated';
          if (!key) key = 'owa_k1_' + crypto.randomBytes(32).toString('hex');
          fs.writeFileSync(file, key + '\n', { mode: 0o644 });
          console.log('wacrm gateway key ' + source + ' (' + key.slice(0, 10) + '…)');
        } else {
          console.log('wacrm gateway key present (' + have.slice(0, 10) + '…)');
        }
        // The cron endpoints' secret, for app and scheduler (used when
        // .env.local sets no AUTOMATION_CRON_SECRET).
        const cronFile = '/run/wacrm-gateway/cron.secret';
        if (!fs.existsSync(cronFile) || !fs.readFileSync(cronFile, 'utf8').trim()) {
          fs.writeFileSync(cronFile, crypto.randomBytes(32).toString('hex') + '\n', { mode: 0o644 });
          console.log('wacrm cron secret generated');
        }
    volumes:
      - openwa-data:/app/data:ro
      - gateway-key:/run/wacrm-gateway

volumes:
  openwa-data:
  gateway-key:
