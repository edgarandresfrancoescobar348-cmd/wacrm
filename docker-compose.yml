name: wacrm

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* vars are inlined at build time — forward them
      # from .env.local as build args. Changing any of them requires
      # a rebuild (docker compose up --build).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
    # Runtime (server-only) secrets come from .env.local; they are
    # never baked into the image.
    env_file:
      - .env.local
    # The server always listens on 3000 inside the container. Pinned
    # here because `environment` wins over `env_file`, so a stray PORT
    # in .env.local can't desync the app from the mapping and the
    # healthcheck below.
    environment:
      PORT: 3000
    # Host side only — HOST_PORT=8080 publishes the app on :8080.
    ports:
      - '${HOST_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------
  # Optional: OpenWA gateway for the "QR Code" connection mode
  # (Settings → WhatsApp). Off by default — start it with
  #   docker compose --profile openwa up -d
  # Its admin API key is generated on first boot:
  #   docker compose exec openwa cat /app/data/.api-key
  # In Settings → WhatsApp → QR Code use URL http://openwa:2785 and that
  # key, and set in .env.local:
  #   OPENWA_ALLOWED_HOSTS=openwa             (private host allow-list)
  #   OPENWA_WEBHOOK_BASE_URL=http://app:3000 (where OpenWA posts events)
  # See docs/openwa.md. Pin a release instead of `latest` in production.
  # ----------------------------------------------------------------
  openwa:
    image: ghcr.io/rmyndharis/openwa:${OPENWA_VERSION:-latest}
    profiles: ['openwa']
    restart: unless-stopped
    stop_grace_period: 75s
    environment:
      NODE_ENV: production
      PORT: 2785
      # whatsapp-web.js (default, lower ban risk) or baileys. Changing it
      # requires re-scanning the QR code.
      ENGINE_TYPE: ${OPENWA_ENGINE_TYPE:-whatsapp-web.js}
      # Lets OpenWA deliver webhooks to the wacrm container on the
      # private compose network.
      SSRF_ALLOWED_HOSTS: app
    volumes:
      - openwa-data:/app/data
    # Loopback only: the dashboard + API are an admin surface.
    ports:
      - '127.0.0.1:${OPENWA_HOST_PORT:-2785}:2785'

volumes:
  openwa-data:
